# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  CTI Tehdit Brifingi — GitHub Actions ile gunluk otomasyon
#  Ubuntu sunucudaki systemd timer'in yerini alir.
#  Public repo oldugu icin Actions dakikalari UCRETSIZ ve sinirsizdir.
#
#  KURULUM: Settings > Secrets and variables > Actions altina 7 secret ekle:
#    GEMINI_API_KEY, SMTP_USERNAME, SMTP_PASSWORD, EMAIL_FROM, EMAIL_TO,
#    INVENTORY_JSON, VENDOR_ALIASES_JSON
#  (SMTP_SERVER/SMTP_PORT gizli bilgi degil, asagida sabit yazili.)
#  INVENTORY_JSON/VENDOR_ALIASES_JSON: organizasyonun urun envanterini
#  ifsa ettigi icin kaynak kodunda degil, secret olarak tutulur.
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

name: CTI Tehdit Brifingi

on:
  schedule:
    # Birincil slot: 08:15 Istanbul. 2026-08-29: bilerek Gemini kota
    # sifirlamasindan (Pasifik gece yarisi = kisin 11:00, yazin 10:00
    # Istanbul) ONCEYE cekildi -- GitHub'in schedule gecikmesini (asagida)
    # telafi etmek icin. Billing KAPALI, 20 RPD/gun limiti hala gecerli;
    # kisin bu slot nadiren onceki gunun (agir manuel test gunlerinde
    # tukenmis) kotasina denk gelebilir. Bu kabul edilebilir cunku:
    #   1) _MODEL_CHAIN'deki 5 modelin HER BIRININ AYRI kotasi var,
    #   2) asagidaki YEDEK slot (15:00) sifirlamadan HER ZAMAN sonradir,
    #      yani birincisi kota yuzunden hic mail atamasa bile ikincisi
    #      calisir. Detay: [[cti-news-feed-automation]] hafiza notu.
    - cron: '15 8 * * *'
      timezone: "Europe/Istanbul"
    # YEDEK slot (15:00 Istanbul, kota sifirlamasindan HER ZAMAN sonra).
    # 2026-08-28: GitHub Actions'in schedule tetikleyicisi bu repoda ilk
    # gunden beri gecikiyor (once ~35-50 dk, sonra 11-12 saate cikti) ve
    # bir gun HIC tetiklenmedi. Bu, GitHub'in kendi actions/runner#4468
    # numarali, halen ACIK ve cozulmemis platform hatasiyla birebir
    # ortusuyor ("continuously increasing drift in scheduled workflow")
    # -- bizim kodumuzda/config'imizde bir hata degil, timezone anahtarini
    # kaldirmak da cozmuyor (referans vakada duz UTC cron'da da ayni sorun
    # var). Cozum: TEK bir cron slotuna guvenmek yerine, ayni gun icinde
    # BAGIMSIZ ikinci bir slot daha tanimliyoruz. Asagidaki "Bugun zaten
    # gonderildi mi kontrol et" adimi, birincisi zaten basariyla gitmisse
    # bunun mail atmasini engeller -- iki slotun AYNI ANDA gecikme/dusme
    # ihtimali tek slottan cok daha dusuk.
    - cron: '00 15 * * *'
      timezone: "Europe/Istanbul"
  # Actions sekmesinden "Run workflow" butonu ile elle de calistirilabilir
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: mail GONDERME, sadece onizlemeyi artifact olarak uret"
        type: boolean
        default: false
      force_send:
        description: "Bugun zaten gonderilmis olsa bile zorla gonder (dedup kontrolunu atla)"
        type: boolean
        default: false

# Ayni anda birden fazla calistirma olmasin (elle tetikleme + zamanlanmis cakisirsa)
concurrency:
  group: cti-briefing
  cancel-in-progress: false

# Varsayilan olarak sadece okuma; yazma yetkisi sadece keepalive job'inda acilir
permissions:
  contents: read

jobs:
  # ── Ana is: brifingi uret ve mail at ────────────────────────────────────
  briefing:
    runs-on: ubuntu-latest
    # Takilirsa durdur. 2026-08-27'de 20 dk'dan 30 dk'ya cikarildi: Gemini'nin
    # 43 makalelik brifingi uretmesi olculdugunde ~280 sn suruyor ve script-ici
    # toplam Gemini butcesi 15 dk. Feed cekme + gorsel isleme ile birlikte en
    # kotu senaryo ~19 dk'ya ulasiyor, 20 dk'lik limit buna cok yakindi.
    timeout-minutes: 30
    # "Bugun zaten gonderildi mi" kontrolu icin bu job'a ozel actions:read
    # yetkisi (gh run list). Ust duzey permissions bilerek sadece contents:
    # read tutuluyor, burada SADECE bu job icin genisletiliyor.
    permissions:
      contents: read
      actions: read

    steps:
      - name: Repoyu indir
        uses: actions/checkout@v7

      # Iki bagimsiz schedule slotu var (bkz. yukaridaki "on.schedule" yorumu).
      # Biri zaten basariyla mail attiysa digeri SESSIZCE atlanir -- ayni gun
      # iki kez brifing gitmesin. 2026-08-29: elle tetikleme (workflow_dispatch)
      # de bu kontrole tabi -- daha once (27 Agustos) test amacli elle
      # tetikleme, ayni gun ikinci bir GERCEK mail gitmesine sebep olmustu.
      # Istisnalar: dry_run (mail zaten atilmiyor, kontrole gerek yok) ve
      # force_send (bilerek/acikca "yine de gonder" denildiginde).
      - name: Bugun zaten basariyla gonderildi mi kontrol et
        id: dedup
        if: >-
          github.event_name == 'schedule' ||
          (github.event_name == 'workflow_dispatch' && !inputs.dry_run && !inputs.force_send)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # "Gerçek gönderim" tanımı (bkz. CONTEXT.md): schedule-tetikli her
          # başarılı çalışma her zaman gerçektir (schedule'da dry_run hiç
          # yok). workflow_dispatch için ise, dry-run'lar başarıyla bittiğinde
          # "Dry run onizlemesini yukle" adımını çalıştırır (gerçek gönderimde
          # bu adım "skipped" kalır) -- bu yüzden o adımın sonucuna bakarak
          # ayırt ediyoruz, inputs'u geriye dönük sorgulayamadığımız için.
          bugun=$(date -u +%F)
          repo="${{ github.repository }}"
          ids=$(gh run list --repo "$repo" --workflow cti-briefing.yml --status success \
            --json databaseId,createdAt --jq "[.[] | select(.createdAt | startswith(\"$bugun\"))] | .[].databaseId")
          sayi=0
          for id in $ids; do
            dry=$(gh run view "$id" --repo "$repo" --json jobs \
              --jq '[.jobs[].steps[]? | select(.name=="Dry run onizlemesini yukle") | .conclusion] | first // "skipped"')
            if [ "$dry" != "success" ]; then
              sayi=$((sayi + 1))
            fi
          done
          echo "Bugun ($bugun) başarılı GERÇEK gönderim sayısı: $sayi"
          if [ "$sayi" -gt 0 ]; then
            echo "::notice::Bugun zaten basariyla gonderildi, bu calistirma atlaniyor."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Python kur
        if: steps.dedup.outputs.skip != 'true'
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'   # bagimliliklari onbellekle (kurulum hizlanir)

      - name: Bagimliliklari yukle
        if: steps.dedup.outputs.skip != 'true'
        run: pip install -r requirements.txt

      # Secret eksikse anlasilir hata ver (yoksa kod tuhaf sekilde patlar)
      - name: Secret kontrolu
        if: steps.dedup.outputs.skip != 'true'
        env:
          GEMINI_API_KEY:      ${{ secrets.GEMINI_API_KEY }}
          SMTP_USERNAME:       ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD:       ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM:          ${{ secrets.EMAIL_FROM }}
          EMAIL_TO:            ${{ secrets.EMAIL_TO }}
          INVENTORY_JSON:      ${{ secrets.INVENTORY_JSON }}
          VENDOR_ALIASES_JSON: ${{ secrets.VENDOR_ALIASES_JSON }}
        run: |
          eksik=""
          for s in GEMINI_API_KEY SMTP_USERNAME SMTP_PASSWORD EMAIL_FROM EMAIL_TO INVENTORY_JSON VENDOR_ALIASES_JSON; do
            [ -z "${!s}" ] && eksik="$eksik $s"
          done
          if [ -n "$eksik" ]; then
            echo "::error::Eksik secret(lar):$eksik"
            echo "Settings > Secrets and variables > Actions altindan ekleyin."
            exit 1
          fi
          echo "✓ Tum secret'lar tanimli"

      - name: Brifingi calistir
        if: steps.dedup.outputs.skip != 'true'
        env:
          # Gizli degerler — GitHub Secrets'tan gelir, loglarda otomatik maskelenir
          GEMINI_API_KEY:      ${{ secrets.GEMINI_API_KEY }}
          SMTP_USERNAME:       ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD:       ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM:          ${{ secrets.EMAIL_FROM }}
          EMAIL_TO:            ${{ secrets.EMAIL_TO }}
          INVENTORY_JSON:      ${{ secrets.INVENTORY_JSON }}
          VENDOR_ALIASES_JSON: ${{ secrets.VENDOR_ALIASES_JSON }}
          # Gizli olmayan ayarlar (bos string gecmemek icin sabit yazildi)
          SMTP_SERVER: smtp.gmail.com
          SMTP_PORT: "587"
          # workflow_dispatch'ten gelen dry_run girdisi (schedule'da hep "false")
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: python cti_automation.py

      # Dry run onizlemesini indirilebilir yap (mail atilmadi, HTML burada)
      - name: Dry run onizlemesini yukle
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v7
        with:
          name: dry-run-preview-${{ github.run_id }}
          path: logs/dry_run_preview.html
          retention-days: 7
          if-no-files-found: warn

      # Hata olursa uygulama logunu indirilebilir yap (teshis icin)
      - name: Hata durumunda logu yukle
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: cti-log-${{ github.run_id }}
          path: logs/
          retention-days: 7
          if-no-files-found: ignore

  # ── Keepalive: 60 gun kuralina karsi ────────────────────────────────────
  # Public repolarda 60 gun boyunca commit olmazsa GitHub zamanlanmis
  # workflow'u SESSIZCE kapatir. Ayin 1'inde kucuk bir commit atip repoyu
  # aktif tutar. always(): brifing hata verse bile zamanlayici yasasin.
  keepalive:
    needs: briefing
    if: always() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # commit atabilmek icin
    steps:
      - uses: actions/checkout@v7

      - name: Ayin 1'iyse heartbeat commit at
        run: |
          if [ "$(date -u +%d)" != "01" ]; then
            echo "Bugun ayin 1'i degil — keepalive atlaniyor."
            exit 0
          fi
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/heartbeat.txt
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/heartbeat.txt
          git commit -m "chore: keepalive heartbeat (60 gun kurali)" || exit 0
          git push
          echo "✓ Heartbeat commit atildi — zamanlayici aktif kalacak"
